name: Build Safari

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch or tag)'
        required: false
        default: 'main'
  push:
    tags:
      - 'v*'

# TX-04-shape (MIK-2973 follow-up): explicit workflow-level least-privilege permissions
permissions:
  contents: write

jobs:
  convert:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Convert to Safari projects
        run: |
          bash scripts/convert-safari.sh

      - name: Zip Safari projects
        run: |
          set -euo pipefail
          cd safari
          for d in */ ; do
            [ -d "$d" ] || continue
            name=$(echo "$d" | sed 's/[\/ ]/_/g; s/_$//')
            zip -r "../${name}.zip" "$d"
          done
          find .. -maxdepth 1 -mindepth 1 -print | sort | sed -n '1,200p'

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: safari-projects
          path: |
            *.zip

      - name: Upload to GitHub Release (if tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            *.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
