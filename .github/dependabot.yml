version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    ignore:
      # changesets/action v2 requires Changesets CLI v3. Keep the compatible
      # action major until this repository deliberately upgrades the CLI.
      - dependency-name: "changesets/action"
        update-types: ["version-update:semver-major"]
